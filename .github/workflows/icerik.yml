# İçerik düzenleme (Yasin, 25 Kasım 2026): app.enpovi.com Yönetim → enpovi.com → İçerik'te kaydedilen metin ana sayfaya yazılır.
# 10 dakikada bir (ve elle) yayındaki kaydı okur (GET /api/enpovi/icerik/yayin, herkese açık, yalnızca sitede görünecek metin);
# sürüm veri/icerik.json'dakinden farklıysa .github/icerik/uygula.py uygular, site kontrolü geçerse main'e işler (GitHub Pages yayınlar).
# Platform açılamıyorsa (ağ, 5xx) dokunulmaz; 4xx, geçersiz kayıt ya da düşen kontrol: hiçbir şey işlenmez, iş kırmızı. Siteye yazan öteki işle
# (vitrin.yml) aynı sırada çalışır, gönderim .github/site-yaz.sh ile (çakışmada güncel main üstünde yeniden, Pages yapımı istenir). Gizli anahtar yok: yalnızca bu işin kendi GITHUB_TOKEN'ı.
name: İçerik
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: site-yaz, cancel-in-progress: false }
jobs:
  uygula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Yayındaki içeriği al
        id: al
        run: |
          set +e; durum=$(curl -s -m 20 -H 'cache-control: no-cache' -w '%{http_code}' https://app.enpovi.com/api/enpovi/icerik/yayin -o /tmp/icerik.json); set -e
          case "$durum" in
            200) echo "var=1" >> "$GITHUB_OUTPUT" ;;
            4??) echo "::error::içerik adresi $durum döndü (yol ya da izin bozuk)"; exit 1 ;;
            *) echo "platform açılamadı ($durum); dokunulmadı" ;;
          esac
      - name: Uygula, kontrol et, işle
        if: steps.al.outputs.var == '1'
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          .github/site-yaz.sh "İçerik: Yönetim → enpovi.com'dan güncellendi" 'python3 .github/icerik/uygula.py /tmp/icerik.json' index.html en/index.html veri/icerik.json
