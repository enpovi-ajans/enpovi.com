<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Sayfa bulunamadı · Enpovi</title>
<link rel="icon" type="image/svg+xml" href="/marka/favicon.svg">
<link rel="apple-touch-icon" href="/marka/apple-touch-icon.png">

<style>
:root{--forest:#0A0A0A;--lime:#E3001B;--lime2:#FF4D5A}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
body{margin:0;background:var(--forest);color:#fff;font-family:"Inter",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden;position:relative;isolation:isolate}
body:before{content:"";position:fixed;right:-20%;top:-30%;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,rgba(227,0,27,.28),transparent);z-index:-1}
body:after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 40% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 40% 40%,#000 20%,transparent 75%)}
header{padding:calc(24px + env(safe-area-inset-top)) max(24px,env(safe-area-inset-left)) 0}
.marka{display:inline-flex;font-size:28px;color:#fff;--nokta:var(--lime);line-height:1}
.marka .logo{display:block;height:1em;width:auto;overflow:visible}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px max(24px,env(safe-area-inset-left)) 64px;max-width:900px;margin:0 auto;width:100%}
.no{font-family:"Inter",system-ui,sans-serif;font-weight:700;font-size:clamp(110px,26vw,220px);line-height:.8;letter-spacing:-.07em;color:var(--lime2)}
h1{font-family:"Inter",system-ui,sans-serif;font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:-.045em;margin:24px 0 0}
h1 em{font-family:"Inter",-apple-system,system-ui,sans-serif;font-weight:400;color:var(--lime2)}
p{color:rgba(255,255,255,.72);font-size:18px;max-width:44ch;margin:16px 0 0;line-height:1.5}
.b{display:flex;gap:8px;flex-wrap:wrap;margin-top:32px}
.b a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 24px;border-radius:999px;font-weight:700;font-size:15.5px;text-decoration:none;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);background:rgba(255,255,255,.07)}
.b a.ana{background:var(--lime);color:#fff;box-shadow:0 12px 32px -12px rgba(227,0,27,.8)}
.b a:hover{background:rgba(255,255,255,.13)}.b a.ana:hover{background:var(--lime2)}
@media (max-width:560px){.b a{flex:1 1 100%}}
.marka{padding:8px 0;margin:-8px 0} /* dokunma hedefi ≥ 44 px */
</style>
<script>/* Eski paneller kaldırıldı (Kasım 2026): eski panel adresleri yeni platforma (app.enpovi.com) gider. Müşteri adı burada listelenmez
   (herkese açık depo): genel kural. Yalnızca giris/yonetim/enpovi ve tireli tek parçalı adresler (/<ad>-<ad>/; /<ad>-sunum/ → /<ad>/sunum/) yönlenir;
   sitenin kendi bölüm adları ve tiresiz yazım hataları (/iletisim/, /Blog/) markalı 404 sayfasında kalır. */
(function(){var y=location.pathname.split("/").filter(Boolean),p=(y[0]||"").toLowerCase();
if(y.length!==1||!/^(giris|yonetim|enpovi|[a-z0-9]+(-[a-z0-9]+)+)$/.test(p)||p.length>60||/^(blog|hizmetler|isler|en|kvkk|cerez|gizlilik|kosullar|donusum|marka|ortak|veri)-/.test(p))return;
var s=p.match(/^(.+)-sunum$/);location.replace("https://app.enpovi.com/"+(s?s[1]+"/sunum/":p+"/")+location.search+location.hash);})();</script>
<script src="/ortak/analiz.js" defer></script>
</head>
